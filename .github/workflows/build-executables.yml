name: Build Executables

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install backend dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        cd ..
    
    - name: Build backend executable
      run: |
        cd backend
        pyinstaller --onefile --console --name metriclab-backend ^
          --icon=../assets/icon.ico ^
          manage.py
        cd ..
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install
        cd ..
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build
        cd ..
    
    - name: Create Windows installer
      run: |
        mkdir -p installer
        xcopy /E backend\dist installer\backend\
        xcopy /E frontend\build installer\frontend\
        xcopy install-windows.bat installer\
        xcopy run-windows.bat installer\
    
    - name: Upload Windows Build
      uses: actions/upload-artifact@v3
      with:
        name: metriclab-windows
        path: installer/

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 \
          python3-dev build-essential
    
    - name: Install backend dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        cd ..
    
    - name: Build backend executable
      run: |
        cd backend
        pyinstaller --onefile --console --name metriclab-backend \
          manage.py
        cd ..
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install
        cd ..
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build
        cd ..
    
    - name: Create Linux package
      run: |
        mkdir -p appimage
        cp backend/dist/metriclab-backend appimage/
        cp -r frontend/build appimage/
        cp install-linux.sh appimage/
        cp run-linux.sh appimage/
        chmod +x appimage/*.sh
    
    - name: Upload Linux Build
      uses: actions/upload-artifact@v3
      with:
        name: metriclab-linux
        path: appimage/

  build-docker:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.prod
        push: false
        tags: |
          kevinvilleros/metriclab:latest
          kevinvilleros/metriclab:${{ github.sha }}

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/download-artifact@v3
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          metriclab-windows/**
          metriclab-linux/**
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
